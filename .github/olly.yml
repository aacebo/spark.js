model: gpt-4o
parent: https://github.com/microsoft/teams.ts
documentation: https://github.com/microsoft/teams-ai
features:
  issues: true
  discussions: true
  pull_requests: true
index:
  include:
    - '*.md'
    - packages/**/*.ts
    - packages/**/*.md
    - external/**/*.ts
    - external/**/*.md
    - tests/**/*.ts
    - tests/**/*.md
  exclude:
    - packages/config/**/*
    - packages/graph-endpoints/**/*
    - packages/graph-endpoints-beta/**/*
    - packages/graph-tools/**/*
    - packages/graph/**/*
    - packages/devtools/**/*
